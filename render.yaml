services:
  - type: web
    name: aarogya-drishti
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ORIGINS
        value: https://aarogyadrishti.in,https://www.aarogyadrishti.in
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: REMINDER_DELIVERY_ENABLED
        value: "false"
      - key: SCREENING_AI_MODE
        value: mock
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: CLINICAL_AI_URL
        sync: false
      - key: CLINICAL_AI_KEY
        sync: false
      - key: CLINICAL_AI_MODEL_VERSION
        sync: false
